server:
  host: "0.0.0.0"
  port: 12345
  mode: "debug"
  base_url: "http://localhost:12345"
  read_timeout: 30
  write_timeout: 30

database:
  driver: "sqlite"
  # SQLite 配置：文件路径或 ":memory:" 表示内存数据库
  db_name: "./data/fileCodeBox.db"

redis:
  host: "localhost"
  port: 6379
  password: ""
  db: 0

log:
  level: "info"
  filename: ""
  max_size: 100
  max_backups: 10
  max_age: 30
  compress: true

app:
  name: "FileCodeBox"
  version: "1.0.0"
  description: "开箱即用的文件快传系统"
  keywords: "FileCodeBox, 文件快递柜, 口令传送箱, 匿名口令分享文本, 文件"
  datapath: "./data"
  production: false

# 上传配置
upload:
  open_upload: true
  upload_size: 10485760      # 10MB
  enable_chunk: true
  chunk_size: 2097152       # 2MB
  max_save_seconds: 0      # 0 表示永不过期
  require_login: false
  # 文本分享大小上限（字节），默认 222KB（对齐上游）
  text_max_bytes: 227328
  # 扩展名白名单（非空则白名单优先；空 = 仅黑名单模式）
  # allowed_extensions: [".jpg", ".png", ".pdf", ".zip", ".docx"]
  # 魔数校验（拦截改扩展名伪装的可执行文件），默认开
  enable_magic_check: true
  # 过期样式白名单（可裁剪；空 = minute/hour/day/week/month/year/forever 全放行）
  # allowed_expire_styles: ["day", "hour", "forever"]
  # 整文件大小上限（字节），适用于分片/预签名通道；0 = 不限。
  # 注意与 upload_size（单请求体上限）语义不同——分片上传的本义即突破单请求限制
  max_file_size: 0

# 下载配置
download:
  enable_concurrent_download: true
  max_concurrent_downloads: 10
  download_timeout: 300     # 5分钟
  require_login: false
  # s3 直下：后端为 s3 时下载 302 到短时效预签名 URL（流量不过服务器）
  # 注意：对象存储桶需配置 CORS 允许站点来源（浏览器直传/直下场景）
  s3_direct_download: false

# 限流配置（路径感知分维度 token bucket；use_redis=true 多实例共享计数）
rate_limit:
  enabled: true
  global_qps: 100
  upload_qps: 10
  download_qps: 50
  login_qps: 5
  burst: 20
  block_seconds: 60         # 触发限流后的封禁时长
  use_redis: false

# 存储配置
storage:
  type: "local"              # local, s3, webdav, onedrive, nfs
  storage_path: "./data/uploads"
  # s3: null
  # webdav: null
  # onedrive: null
  # nfs: null

# 用户配置
user:
  allow_user_registration: false
  require_email_verify: false
  user_upload_size: 52428800    # 50MB
  user_storage_quota: 1073741824 # 1GB
  session_expiry_hours: 168     # 7天
  max_sessions_per_user: 5
  jwt_secret: "FileCodeBox2025JWT"

# UI 配置
ui:
  theme: "themes/2025"
  background: ""
  page_explain: "请勿上传或分享违法内容。根据《中华人民共和国网络安全法》、《中华人民共和国刑法》、《中华人民共和国治安管理处罚法》等相关规定。传播或存储违法、违规内容，会受到相关处罚，严重者将承担刑事责任。本站坚决配合相关部门，确保网络内容的安全，和谐，打造绿色网络环境。"
  robots_text: |
    User-agent: *
    Disallow: /
  show_admin_addr: false
  opacity: 1
  notify_title: ""
  notify_content: ""

# 可观测性（Prometheus 指标 / OpenTelemetry 追踪）
observability:
  metrics:
    enabled: true
    path: "/metrics"
  tracing:
    enabled: false
    exporter: "otlp"
    endpoint: "localhost:4317"
    service_name: "filecodebox"

# 通知（外部 Webhook 渠道）
notify:
  webhook_url: ""           # notify.created 事件 JSON POST；空 = 禁用（FCB_WEBHOOK_URL）

# 安全配置
security:
  cors:
    allow_origins: []       # 生产环境填写对外域名，如 ["https://fcb.example.com"]
    allow_credentials: false
    enable_hsts: false      # HTTPS 部署时开启
  # 可信代理网段（CIDR）。只有直连对端落在网段内才采信 X-Forwarded-For，
  # 反向代理部署必填（如 nginx/traefik 所在网段），否则限流/锁定按直连 IP 判定
  trusted_proxies: []
  # 取件下载令牌（时间窗 HMAC；取件接口下发，/share/download 强制校验）
  download_token:
    enabled: true
    validity_seconds: 1000
  # 登录/取件失败计数锁定（防爆破；维度 IP+账户/取件码）
  lockout:
    enabled: true
    max_attempts: 10
    window_seconds: 300
    lock_seconds: 600
  # 存储端点 SSRF 防护：默认拒绝 s3/webdav 端点指向私网地址；
  # 局域网 MinIO/WebDAV（飞牛 NAS）部署请改为 true
  ssrf:
    allow_private_networks: false

# MCP server（AI 客户端集成；POST /api/v1/mcp，管理员 JWT 认证）
mcp:
  enabled: true             # FCB_MCP_ENABLED
