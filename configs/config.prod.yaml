# FilesCodeBox 生产环境配置模板
# 请根据实际部署环境修改相关配置

server:
  host: "0.0.0.0"
  port: 8888
  mode: "release"          # 生产环境使用 release 模式
  base_url: "https://your-domain.com"  # 修改为实际域名
  read_timeout: 30
  write_timeout: 30

database:
  driver: "sqlite"
  # SQLite 配置：文件路径或 ":memory:" 表示内存数据库
  # 生产环境建议使用持久化路径
  db_name: "/app/data/fileCodeBox.db"

# Redis 配置（如需要）
redis:
  host: "redis"            # 如果使用 docker-compose 中的 redis 服务
  port: 6379
  password: ""             # 生产环境请设置密码
  db: 0

log:
  level: "info"            # 生产环境使用 info 级别
  filename: "/app/data/filecodebox.log"  # 日志文件路径
  max_size: 100            # MB
  max_backups: 10
  max_age: 30              # days
  compress: true

app:
  name: "FilesCodeBox"
  version: "1.0.0"
  description: "开箱即用的文件快传系统"
  keywords: "FilesCodeBox, 文件快递柜, 口令传送箱, 匿名口令分享文本, 文件"
  datapath: "/app/data"
  production: true         # 生产环境

# 上传配置
upload:
  text_max_bytes: 227328
  enable_magic_check: true
  open_upload: true
  upload_size: 10485760      # 10MB
  enable_chunk: true
  chunk_size: 2097152       # 2MB
  max_save_seconds: 0      # deprecated（从未实现）；全局过期上限用 max_save_seconds_cap
  # max_save_seconds_cap: 0             # 全局过期上限（秒），超过自动钳制；0 = 不限
  # blocked_extensions: [".exe", ".bat", ".sh", ".js", ".jar", ".dll"]  # env: FCB_UPLOAD_BLOCKED_EXTENSIONS
  # 匿名上传 per-IP 日配额（0 = 不限；env: FCB_UPLOAD_ANON_DAILY_COUNT / FCB_UPLOAD_ANON_DAILY_BYTES）
  # anonymous_daily_count: 100
  # anonymous_daily_bytes: 1073741824
  require_login: false

# 下载配置
download:
  enable_concurrent_download: true   # deprecated（从未实现）
  max_concurrent_downloads: 10       # deprecated（从未实现）
  download_timeout: 300     # 5分钟
  require_login: false
  # s3 直下：后端为 s3 时下载 302 到短时效预签名 URL（流量不过服务器）
  # 注意：对象存储桶需配置 CORS 允许站点来源（浏览器直传/直下场景）
  s3_direct_download: false

# 存储配置
storage:
  type: "local"              # local, s3, webdav, onedrive, nfs
  storage_path: "/app/data/uploads"
  # s3: null
  # webdav: null
  # onedrive: null
  # nfs: null

# 用户配置
user:
  allow_user_registration: false  # 生产环境建议关闭注册或设置严格验证
  require_email_verify: false
  user_upload_size: 52428800    # 50MB
  user_storage_quota: 1073741824 # 1GB
  session_expiry_hours: 168     # 7天
  max_sessions_per_user: 5
  jwt_secret: "CHANGE_THIS_TO_A_SECURE_RANDOM_STRING_IN_PRODUCTION"  # 生产环境必须修改

# UI 配置
ui:
  theme: "themes/2025"
  background: ""
  page_explain: "请勿上传或分享违法内容。根据《中华人民共和国网络安全法》、《中华人民共和国刑法》、《中华人民共和国治安管理处罚法》等相关规定。传播或存储违法、违规内容，会受到相关处罚，严重者将承担刑事责任。本站坚决配合相关部门，确保网络内容的安全，和谐，打造绿色网络环境。"
  robots_text: |
    User-agent: *
    Disallow: /
  show_admin_addr: false
  opacity: 1
  notify_title: ""
  notify_content: ""

# 限流配置（路径感知分维度；use_redis=true 多实例共享计数）
rate_limit:
  enabled: true
  global_qps: 100
  upload_qps: 10
  download_qps: 50
  login_qps: 5
  burst: 20
  block_seconds: 60
  use_redis: false

# 安全配置
security:
  trusted_proxies: []          # 反代部署必填，如 ["10.0.0.0/8"]
  download_token:
    enabled: true
    validity_seconds: 1000
  lockout:
    enabled: true
    max_attempts: 10
    window_seconds: 300
    lock_seconds: 600
  api_token:
    enabled: true                 # 用户级 API Key 总开关（env: FCB_API_TOKEN_ENABLED）
    per_key_qps: 20               # 单 Key 令牌桶限流；0 = 不限
    per_key_burst: 40
  ssrf:
    allow_private_networks: false  # 局域网 MinIO/WebDAV（飞牛 NAS）改 true

# 通知（外部 Webhook 渠道）
notify:
  webhook_url: ""

# MCP server（AI 客户端集成；POST /api/v1/mcp，管理员 JWT 认证）
mcp:
  enabled: true             # FCB_MCP_ENABLED

# 内容审核（默认关闭；FCB_MODERATION_ENABLED / FCB_MODERATION_BLOCKED_WORDS / FCB_MODERATION_BLOCK_ACTION）
moderation:
  enabled: false
  # blocked_words: ["词1", "词2"]
  block_action: reject      # reject=直接拒绝 | pending=待审进管理端队列

# 管理端运维
admin:
  log_retention_days: 90    # 审计/传输日志保留天数，0=永久
