name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: server/go.sum
      - name: Build & Vet
        run: |
          go build ./...
          go vet ./...
      - name: Test
        run: go test -race ./...
      # lockfile 一致性守卫（学习上游：依赖只改一半时 CI 即失败）
      - name: Module verify
        run: |
          go mod verify
          go mod download -x 2>&1 | tail -1

  docker:
    # main 推送时验证完整镜像(前端现场 npm ci 构建)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: server }
      - uses: actions/checkout@v4
        with: { repository: pigeonbox/frontend, path: frontend }
      - name: 工作区布局 + ignore 规则
        run: |
          mkdir -p ${{ github.workspace }}/ws
          mv server frontend ${{ github.workspace }}/ws/
          printf '*/.git\n**/node_modules\n*/bin\n*/data\n*/logs\ngo.work\ngo.work.sum\n' > ${{ github.workspace }}/ws/.dockerignore
      - uses: docker/setup-buildx-action@v3
      - name: Build image(no push)
        uses: docker/build-push-action@v6
        with:
          context: ${{ github.workspace }}/ws
          file: ${{ github.workspace }}/ws/server/Dockerfile
          push: false
          tags: pigeonbox-server:ci
