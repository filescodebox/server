name: Release
# 打 v* tag → 构建多架构镜像推 ghcr.io/filescodebox/server 与
# ghcr.io/filescodebox/frontend（同一版本列车：前后端分离部署,
# chart 以单一 appVersion 同时锁两个镜像）。
# server 镜像为纯后端(0.9.0 起不含前端静态资源),frontend 镜像
# (nginx 静态+API 反代)承担全部对外入口。
on:
  push:
    tags: ["v*"]

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/filescodebox/server

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with: { path: server }
      - uses: actions/checkout@v4
        with: { repository: filescodebox/frontend, path: frontend }
      - name: 工作区布局 + ignore 规则
        run: |
          mkdir -p ${{ github.workspace }}/ws
          mv server frontend ${{ github.workspace }}/ws/
          printf '*/.git\n**/node_modules\n*/bin\n*/data\n*/logs\ngo.work\ngo.work.sum\n' > ${{ github.workspace }}/ws/.dockerignore
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: ${{ github.workspace }}/ws
          file: ${{ github.workspace }}/ws/server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # buildx 默认 provenance 认证清单会使 GitHub Packages 页面渲染 500
          # (registry 拉取不受影响,仅 Web UI 坏),关掉保证包页可开、可见性可改
          provenance: false
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.meta.outputs.date }}
            GOPROXY=https://proxy.golang.org,direct

      # ── frontend 镜像（k8s 前后端分离部署；tag 与 server 完全一致）──
      - id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/filescodebox/frontend
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: ${{ github.workspace }}/ws/frontend
          file: ${{ github.workspace }}/ws/frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          provenance: false
          build-args: |
            NPM_REGISTRY=https://registry.npmjs.org
